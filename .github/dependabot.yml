version: 2

# Dependabot is configured ONLY for GitHub Actions for now.
# Bumps action versions in .github/workflows/ and .github/actions/ weekly.
#
# Why only Actions: runtime deps (bun, drizzle, nest, etc.) stay manual for
# now to keep noise low while the project is pre-v0.1. When the team grows
# and weekly bumps become administrative noise, consider adding the npm/bun
# ecosystem here (or switch to Renovate, which is more flexible).
#
# Outcome: one weekly PR "Bump actions/X from a to b" with changelog and
# SHA diff. CI validates before merging.

# Minimum release age policy: dependency updates are adopted only after a
# release has been public for at least 7 days (the `cooldown` below), giving
# time for bad releases or supply-chain compromises to surface. Manual bun
# dependency bumps follow the same 7-day rule: check the release date before
# bumping.

updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
